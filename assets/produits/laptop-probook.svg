<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Portable ProBook 15 pouces">
  <defs>
    <linearGradient id="lap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f2f0"/>
      <stop offset="1" stop-color="#c9e2de"/>
    </linearGradient>
    <linearGradient id="lap-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a3e"/>
      <stop offset="1" stop-color="#0a2427"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#lap-bg)"/>

  <!-- Écran -->
  <rect x="110" y="55" width="180" height="120" rx="10" fill="#e7edec" stroke="#0f5257" stroke-width="4"/>
  <rect x="122" y="67" width="156" height="96" rx="4" fill="url(#lap-screen)"/>
  <!-- Reflet et icônes à l'écran -->
  <rect x="134" y="79" width="60" height="8" rx="4" fill="#e9a820" opacity="0.9"/>
  <rect x="134" y="95" width="100" height="6" rx="3" fill="#7fb3ae"/>
  <rect x="134" y="108" width="80" height="6" rx="3" fill="#7fb3ae"/>
  <rect x="134" y="121" width="90" height="6" rx="3" fill="#4d8681"/>
  <circle cx="200" cy="69" r="2.4" fill="#e7edec"/>

  <!-- Base du clavier -->
  <path d="M84 176 H316 L332 214 Q334 220 328 220 H72 Q66 220 68 214 Z" fill="#0f5257"/>
  <path d="M84 176 H316 L328 208 H72 Z" fill="#12656b"/>
  <rect x="176" y="212" width="48" height="5" rx="2.5" fill="#0a2427"/>

  <!-- Pavé tactile -->
  <rect x="172" y="184" width="56" height="18" rx="3" fill="#0a3b3f"/>

  <!-- Ombre au sol -->
  <ellipse cx="200" cy="232" rx="120" ry="10" fill="#0a3b3f" opacity="0.12"/>
</svg>
