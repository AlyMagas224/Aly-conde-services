<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Installation et configuration d'ordinateur">
  <defs>
    <linearGradient id="srv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee9f8"/>
      <stop offset="1" stop-color="#ddd4f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#srv-bg)"/>

  <!-- Tour d'ordinateur -->
  <rect x="110" y="90" width="90" height="130" rx="8" fill="#123a3e"/>
  <rect x="122" y="104" width="66" height="10" rx="3" fill="#e3def3"/>
  <rect x="122" y="122" width="66" height="6" rx="3" fill="#5a4c94"/>
  <circle cx="155" cy="196" r="14" fill="#0a2427"/>
  <circle cx="155" cy="196" r="8" fill="#e9a820"/>

  <!-- Clé à molette -->
  <g transform="translate(232 118) rotate(28)">
    <rect x="-9" y="0" width="18" height="90" rx="9" fill="#e9a820"/>
    <path d="M-24 -6 a24 24 0 1 0 48 0 a24 24 0 1 0 -48 0
             M-12 -6 a12 12 0 1 1 24 0 a12 12 0 1 1 -24 0 Z"
          fill="#e9a820" fill-rule="evenodd"/>
  </g>

  <!-- Tournevis -->
  <g transform="translate(275 178) rotate(-18)">
    <rect x="-6" y="0" width="12" height="70" rx="6" fill="#0f5257"/>
    <path d="M-14 -22 L14 -22 L6 4 L-6 4 Z" fill="#cfcfd6"/>
    <rect x="-16" y="-30" width="32" height="12" rx="4" fill="#0a3b3f"/>
  </g>

  <!-- Coche de validation -->
  <circle cx="205" cy="72" r="20" fill="#1f7a4d"/>
  <path d="M196 72 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <ellipse cx="200" cy="238" rx="120" ry="9" fill="#0a3b3f" opacity="0.1"/>
</svg>
