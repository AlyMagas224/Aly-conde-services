<!DOCTYPE html>

<head>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Polices : Fraunces (titres, logo) et Hanken Grotesk (texte) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
