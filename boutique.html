<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique — ALY &amp; CONDE Services</title>
  <meta name="description" content="Parcourez nos ordinateurs, accessoires et services informatiques.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Polices : Fraunces (titres, logo) et Hanken Grotesk (texte) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="shop">

  <!-- En-tête et pied de page : dessinés par js/layout.js -->
  <header class="site-header" id="site-header"></header>

  <noscript>
    <p class="container" style="padding-block:1rem">Ce site a besoin de JavaScript pour fonctionner. Veuillez l'activer dans votre navigateur.</p>
  </noscript>

  <main id="main">
    <section class="page-head container">
      <h1>Boutique</h1>
      <p id="results-count" aria-live="polite"></p>
    </section>

    <div class="container shop-layout">
      <aside class="filters" aria-label="Filtres">
        <details id="filters-details" open>
          <summary class="filters-toggle">Rechercher, filtrer et trier</summary>
          <div class="field">
            <label for="search">Rechercher</label>
            <input type="search" id="search" placeholder="Nom, mot-clé…" autocomplete="off">
          </div>

          <fieldset class="field">
            <legend>Catégorie</legend>
            <div class="chip-group" id="category-filter"></div>
          </fieldset>

          <div class="field">
            <label for="sort">Trier par</label>
            <select id="sort">
              <option value="pertinence">Pertinence</option>
              <option value="prix-asc">Prix croissant</option>
              <option value="prix-desc">Prix décroissant</option>
              <option value="nom">Nom (A à Z)</option>
            </select>
          </div>

          <label class="check">
            <input type="checkbox" id="in-stock">
            <span>Articles disponibles seulement</span>
          </label>

          <button type="button" class="btn btn-small btn-block" id="reset-filters">Réinitialiser</button>
        </details>
      </aside>

      <section aria-label="Résultats">
        <div class="product-grid" id="product-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
